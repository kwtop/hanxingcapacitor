<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>HAN XING · Satechi 首页实测对比</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f0ec;color:#1b1c21;font:14px/1.5 system-ui,sans-serif}header{padding:24px 28px;background:white;border-bottom:1px solid #d3d4d5}h1{margin:0 0 8px;font-size:24px;font-weight:600}p{margin:0}a{color:inherit;text-underline-offset:3px}.toolbar{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;padding:16px 28px;background:white;position:sticky;top:0;z-index:5;box-shadow:0 2px 3px #0001}label{display:flex;align-items:center;gap:8px}select,button{min-height:36px;padding:6px 10px;background:white;color:inherit;border:1px solid #b7b7b7;border-radius:4px;font:inherit}button{cursor:pointer}input{accent-color:#1b1c21}main{padding:24px;overflow:auto}.side{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.side.actual{grid-template-columns:repeat(2,var(--vw));width:max-content}.side figure{margin:0;min-width:0}.side figcaption{padding:10px 12px;background:white;position:sticky;top:69px;z-index:2}.side img{display:block;width:100%;height:auto}.overlay{position:relative;max-width:var(--vw);margin:auto;overflow:hidden;background:white}.overlay img{position:absolute;inset:0 auto auto 0;width:100%;height:auto}.overlay img:first-child{position:relative;display:block}#candidate-layer{opacity:.5}footer{padding:24px 28px;background:white}#status{color:#555;font-size:13px}.hidden{display:none!important}@media(max-width:700px){header{padding:20px}h1{font-size:20px}.toolbar{padding:12px;gap:12px}main{padding:12px}.side{gap:10px}.side figcaption{font-size:12px;padding:8px;top:110px}}
</style></head><body>
<header><h1>Satechi 参考 / HAN XING 首页预览</h1><p>保留原导航、真实内容和询盘功能。产品图按原样品保留标志与印字；原首页未覆盖，未部署。</p><p><a href="http://127.0.0.1:4335/previews/satechi-home/" target="_blank" rel="noopener">打开可操作首页预览</a> · <a href="VISUAL-REVIEW.md">视觉验收与差异说明</a> · <a href="../REFERENCE-VISUAL-SPEC.md">实测视觉规格</a></p></header>
<div class="toolbar">
 <label>视口<select id="viewport"><option value="1440">1440 × 900</option><option value="1024">1024 × 768</option><option value="768">768 × 1024</option><option value="390">390 × 844</option></select></label>
 <label>轮次<select id="round"><option value="pass-final">最终验收</option><option value="pass-01">第1轮</option><option value="pass-02">第2轮</option><option value="pass-03">第3轮</option></select></label>
 <label>方式<select id="mode"><option value="side">并排</option><option value="overlay">半透明叠加</option></select></label>
 <label id="actual-control"><input id="actual" type="checkbox">原始尺寸</label>
 <label id="opacity-control" class="hidden">预览透明度<input id="opacity" type="range" min="0" max="100" value="50" aria-label="预览透明度"></label>
 <span id="status" role="status"></span>
</div>
<main><div id="side" class="side"><figure><figcaption>参考 · <a id="ref-link" target="_blank" rel="noopener">完整原图</a></figcaption><img id="reference" alt="指定视口的Satechi完整首页截图"></figure><figure><figcaption>HAN XING · <a id="candidate-link" target="_blank" rel="noopener">完整原图</a></figcaption><img id="candidate" alt="相同视口的本地完整首页截图"></figure></div><div id="overlay" class="overlay hidden"><img id="reference-layer" alt="参考图底层"><img id="candidate-layer" alt="本地预览叠加层"></div></main>
<footer><p>两图保持同一视口宽度，不拉伸页面高度。字体为有授权来源的 Manrope / Inter 近似；导航、B2B文案和真实产品图片与零售参考不同。</p><p>768px参考未显示首屏文字及次级应用图，预览保留这些内容。像素差异不能换算为所谓还原百分比。</p></footer>
<script>
const q=id=>document.getElementById(id);let width=1440;
function sizeOverlay(){const stage=q('overlay');if(stage.classList.contains('hidden'))return;const a=q('reference-layer'),b=q('candidate-layer');stage.style.height=Math.max(a.naturalHeight,b.naturalHeight)*stage.clientWidth/width+'px'}
function update(){width=Number(q('viewport').value);const round=q('round').value,ref=`reference/${width}-full.jpg`,candidate=`${round}/${width}/candidate.png`;document.documentElement.style.setProperty('--vw',width+'px');q('reference').src=q('reference-layer').src=q('ref-link').href=ref;q('candidate').src=q('candidate-layer').src=q('candidate-link').href=candidate;const overlay=q('mode').value==='overlay';q('side').classList.toggle('hidden',overlay);q('overlay').classList.toggle('hidden',!overlay);q('actual-control').classList.toggle('hidden',overlay);q('opacity-control').classList.toggle('hidden',!overlay);q('side').classList.toggle('actual',q('actual').checked);q('status').textContent=width===768?'平板保留参考未显示的应用内容':'';sizeOverlay()}
['viewport','round','mode','actual'].forEach(id=>q(id).addEventListener('change',update));q('opacity').addEventListener('input',()=>q('candidate-layer').style.opacity=q('opacity').value/100);['reference-layer','candidate-layer'].forEach(id=>q(id).addEventListener('load',sizeOverlay));new ResizeObserver(sizeOverlay).observe(q('overlay'));update();
</script></body></html>
